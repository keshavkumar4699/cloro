# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cloro
      POSTGRES_PASSWORD: cloro
      POSTGRES_DB: cloro
    ports:
      - "5432:5432"
    volumes:
      - cloro-db:/var/lib/postgresql/data
volumes:
  cloro-db:
